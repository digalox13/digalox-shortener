services: 
  mysql:
    image: mysql
    container_name: mysql-db
    environment: 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes: 
      - ./containers-data/mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: 
      - backend-network
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "1000:80"
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: "3306"
    depends_on:
      - mysql
    networks:
      - frontend-network
      - backend-network
    restart: always
  frontend: 
    image: nginx:alpine
    container_name: nginx
    volumes: 
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - frontend-network
      - backend-network
    restart: always

  backend:
    build: ./backend
    container_name: backend-python
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on: 
      - mysql
    networks:
      - backend-network
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - frontend-network

networks:
  frontend-network:
    name: frontend
    driver: bridge

  backend-network:
    name: backend
    driver: bridge
    internal: true
